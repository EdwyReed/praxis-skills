name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use a Trusted Publishing capable npm CLI
        run: npm install --global npm@latest
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: pwsh -NoProfile -File ./tests/audits/run-all.ps1
      - run: npm pack --dry-run --json
      - name: Publish with provenance
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'beta' : 'latest'")
          npm publish --access public --tag "$TAG" --provenance
