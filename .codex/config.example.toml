# Example Codex configuration for users of this workflow package.
# Copy relevant sections into ~/.codex/config.toml or a project-local trusted config.

model = "gpt-5.5"
model_reasoning_effort = "medium"

[features]
# Optional. Required only when a workflow explicitly asks Codex to use subagents.
multi_agent = true

